# 开发/测试环境覆盖配置（与 docker-compose.yml 一起使用）
services:
  backend:
    environment:
      - DEBUG=true
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - annotations_data:/app/annotations

  frontend:
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
